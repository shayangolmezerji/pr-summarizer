name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Actions are pinned to a commit rather than a moving major tag, so a
      # takeover of the upstream tag cannot change what runs on the runner.
      # Dependabot opens the PRs that move these hashes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # The suite reaches no endpoint: model access is exercised through an
      # injectable transport, and the one real socket it opens is a loopback
      # connect to a port nothing listens on. No endpoint, key or egress needed.
      - name: Test
        run: python -m pytest -q
