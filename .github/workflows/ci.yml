name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # The suite reaches no endpoint: model access is exercised through an
      # injectable transport, and the one real socket it opens is a loopback
      # connect to a port nothing listens on. No endpoint, key or egress needed.
      - name: Test
        run: python -m pytest -q
