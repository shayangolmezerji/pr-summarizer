name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Actions are pinned to a commit rather than a moving major tag, so a
      # takeover of the upstream tag cannot change what runs on the runner.
      # Dependabot opens the PRs that move these hashes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # The suite reaches no endpoint: model access is exercised through an
      # injectable transport, and the one real socket it opens is a loopback
      # connect to a port nothing listens on. No endpoint, key or egress needed.
      - name: Test
        run: python -m pytest -q
