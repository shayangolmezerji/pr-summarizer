name: PR summary

# Reads a pull-request diff, builds a structural brief with the stdlib ast, and
# posts it as a comment. GitHub ran this file once, on a Dependabot pull
# request, and stopped at the first step: `uses: ./` cannot locate an action
# that is not on disk yet. The checkout below is what that run showed was
# missing, and nothing in this file has been executed by GitHub since.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  structural-summary:
    runs-on: ubuntu-latest
    steps:
      # The runner reads action.yml off the workspace before any of the action's
      # steps can run, so the action's own checkout cannot be what puts it there:
      # only a step before `uses: ./` can be, and the failed run had none.
      # fetch-depth: 0 because the base sha passed below is not in the single
      # commit a default checkout brings down, and a caller cannot count on a
      # later fetch to deepen a shallow clone. Pinned to the same commit ci.yml
      # and action.yml use: a moving major tag is upstream's to repoint, and
      # Dependabot opens the PRs that move these.
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Structural brief
        id: brief
        # The action re-checks out with fetch-depth: 0 (see action.yml). In this
        # job that is a re-fetch of a tree already deep enough; it stays there for
        # callers who do not put the depth in themselves, which is what keeps the
        # action usable outside this workflow.
        uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # Model access is OFF unless the base URL and the model name are both
          # set. Leaving them unset means the job posts the structural brief
          # computed on the runner and sends no diff, no brief and no source to
          # any third-party endpoint. The key is optional because a local server
          # wants none. Point model-base-url at a provider only once you accept
          # that the brief (a summary of your source, not the source) is sent to
          # it, through that proxy if the runner has one.
          model-base-url: ${{ vars.PRSUMMARIZER_BASE_URL }}
          model-name: ${{ vars.PRSUMMARIZER_MODEL }}
          model-api-key: ${{ secrets.PRSUMMARIZER_API_KEY }}

      - name: Comment on the pull request
        # GITHUB_TOKEN is provided by the runner and scoped to this repo; no
        # personal or third-party token is used.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRIEF: ${{ steps.brief.outputs.brief }}
        run: |
          set -euo pipefail
          # The body reaches gh through a file, not argv, for two reasons that
          # hold: as one argument its length counts against the runner's ARG_MAX,
          # shared with the environment block, and text carried through a shell
          # substitution loses its trailing newlines. What did not change is the
          # exposure. argv was readable for the life of the call; this file is
          # readable for the life of the step, and used to outlive a gh that
          # failed. So it goes on the step's way out, trap and all: the window is
          # shorter than the job, not closed.
          body="$RUNNER_TEMP/pr-comment-body.md"
          trap 'rm -f "$body"' EXIT
          {
            printf '## Structural summary\n\n'
            # The fence is written by the package's helper, because $BRIEF is the
            # action's whole stdout: the brief plus, when a model answered, prose
            # no renderer here defused. `python` is on PATH because the action ran
            # setup-python in this job.
            printf '%s' "$BRIEF" \
              | python -c 'import sys; from pr_summarizer.brief import fenced; sys.stdout.write(fenced(sys.stdin.read()))'
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
