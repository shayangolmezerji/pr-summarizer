name: PR Structural Summary
description: >
  Compute a structural brief of a pull-request diff with the stdlib ast and
  write it to the job summary. Model prose is opt-in: with no endpoint inputs
  set, the tool is run with --no-model and no model request leaves the runner.
  When they are set, the brief sent to that endpoint is built out of names, paths
  and signatures taken out of the pull request, so text the PR carried reaches the
  model framed as data to summarize rather than as instructions to follow; the
  framing narrows that surface and does not close it.

# What this action guarantees an operator: the structural brief is computed
# locally and reaches the job summary even when the optional model call fails,
# which still reddens the step. The model call only happens when model-base-url
# AND model-name are provided, so enabling it is a deliberate act that accepts
# the brief being sent to that endpoint, and with it the names and signatures
# taken out of this PR's code: its author's own where they added or changed a
# region, whoever wrote it earlier where the diff only removed it or a rename was
# inferred around it.

inputs:
  base:
    description: Start revision of the diff range, usually the PR base sha.
    required: true
  head:
    description: End revision of the diff range, usually the PR head sha.
    required: false
    default: ${{ github.sha }}
  model-base-url:
    description: >
      OpenAI-compatible base URL. Set only if you accept the structural brief
      leaving the runner. Empty disables the model.
    required: false
    default: ""
  model-name:
    description: Model name sent in the request.
    required: false
    default: ""
  model-api-key:
    description: Bearer token for the endpoint. Never echoed into any output.
    required: false
    default: ""

outputs:
  brief:
    description: The structural brief text, for a caller to post as a comment.
    value: ${{ steps.brief.outputs.brief }}

runs:
  using: composite
  steps:
    # Pinned to the same commits .github/workflows/ci.yml uses, for the same
    # reason: a moving major tag is upstream's to repoint. This action is checked
    # out by a workflow that fires on pull_request with pull-requests: write, so
    # whatever these two resolve to runs on a holder of that token.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Both ends of the range have to exist locally to diff them. This is the
        # action's own say-so on the subject and not a caller's guarantee: a clone
        # that came down shallow cannot count on this fetch to deepen it, so
        # .github/workflows/pr-summary.yml asks for the depth at its first checkout.
        fetch-depth: 0

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install pr-summarizer
      shell: bash
      run: pip install "$GITHUB_ACTION_PATH"

    - name: Build the structural brief
      id: brief
      shell: bash
      env:
        PRSUMMARIZER_BASE_URL: ${{ inputs.model-base-url }}
        PRSUMMARIZER_MODEL: ${{ inputs.model-name }}
        PRSUMMARIZER_API_KEY: ${{ inputs.model-api-key }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      run: |
        set -euo pipefail
        flags=(--git "$BASE" "$HEAD")
        if [ -z "${PRSUMMARIZER_BASE_URL}" ] || [ -z "${PRSUMMARIZER_MODEL}" ]; then
          flags+=(--no-model)
        fi
        # The file holds the raw brief for the output; the step summary gets a
        # fenced copy so markdown renders the indentation verbatim. A failing
        # model call exits 3, and the brief it fails on is the one thing the
        # step must still publish, so the status is carried and re-raised last.
        rc=0
        pr-summarizer "${flags[@]}" > "$RUNNER_TEMP/pr-brief.txt" || rc=$?
        # The fence is written by the package's own helper, because what it wraps
        # is the CLI's whole stdout: the brief plus, when a model answered, prose
        # the renderer never saw. setup-python above put `python` on PATH for the
        # rest of this action's steps.
        python -c 'import sys; from pr_summarizer.brief import fenced; sys.stdout.write(fenced(sys.stdin.read()))' \
          < "$RUNNER_TEMP/pr-brief.txt" >> "$GITHUB_STEP_SUMMARY"
        {
          echo 'brief<<PRSUMMARIZER_BRIEF_EOF'
          cat "$RUNNER_TEMP/pr-brief.txt"
          echo 'PRSUMMARIZER_BRIEF_EOF'
        } >> "$GITHUB_OUTPUT"
        exit "$rc"
